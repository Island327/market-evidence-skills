name: Package and analysis checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-xlsx.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/market-evidence/scripts/analyze_table.py --input skills/market-evidence/assets/examples/market.csv --config skills/market-evidence/assets/examples/analysis-config.json --out outputs/demo
