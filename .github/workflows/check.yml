name: Package and analysis checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-xlsx.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/market-evidence/scripts/analyze_table.py --input skills/market-evidence/assets/examples/market.csv --config skills/market-evidence/assets/examples/analysis-config.json --out outputs/demo
